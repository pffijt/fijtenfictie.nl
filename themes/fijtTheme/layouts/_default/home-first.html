<article>
    <div class="row">
        <div class="col-12 col-md-12 col-lg-12">
            <a href="{{ .RelPermalink }}" class="take-height">
                {{ .Render "image-styled"}}
            </a>
        </div>
        <div class="col-12 col-md-12 col-lg-12">
            <h2 class="article-header first-header"><a href="{{ .RelPermalink }}">{{ .LinkTitle | upper }}</a></h2>
            <div class="article-paragraph">
                <p>
                    {{ .Summary }}
                </p>
                {{ if .Truncated }}
                <a class="article-link readmore" href="{{ .RelPermalink }}">{{ i18n "readmore" }}<span class="article-link-dots">...</span></a>
                {{ end }}
            </div>
        </div>
    </div>
    <footer>
        <hr />
    </footer>
</article>
