{{ define "main" }}
  <div class="container">
    <h1 class="article-header">{{ .Title }}</h1>
    {{ .Content }}
  </div>
  {{ range .Pages }}
    <div class="container">
      <h2 class="article-header"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ .Content }}
      <hr />
    </div>
  {{ end }}
{{ end }}
