<article class="home-third">
    <div class="row">
        <div class="col-12 col-md-12">
            <h2 class="article-header home-header"><a href="{{ .RelPermalink }}">{{ .LinkTitle | upper }}</a></h2>
            <div class="article-paragraph third-home-paragraph">
                {{ .Render "author-flat" }}
                <p>
                    {{ .Summary | markdownify }}
                </p>
                {{ if .Truncated }}
                <a class="article-link readmore" href="{{ .RelPermalink }}">{{ i18n "readmore" }}<span class="article-link-dots">...</span></a>
                {{ end }}
            </div>
        </div>
    </div>
    <footer>
        <hr />
    </footer>
</article>
