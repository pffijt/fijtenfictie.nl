<div class="row text-center">
    <div class="col">
        {{ $image := ((((.Resources.GetMatch (.Param "imgsrc" )).Fit "750x350" ) | images.Filter (images.Colorize 24 2 99)).Process "webp q85") }}
        <img src='{{ $image.RelPermalink }}' width="750" height="350" title='{{ .Param "imgalt" }}' alt='{{ .Param "imgalt" }}' class='{{ .Param "imgclass" | default "" }}' />
    </div>
</div>
