{{ define "main" }}
  {{ $pages := where site.RegularPages.ByExpiryDate "Section" "ne" "header" }}
  <div class="container">
    <div class="row">
      <div class="col">
        {{ range first 1 $pages }}
          <div class="col">
            <div class="article-card">
              {{ .Render "home-first"}}
            </div>
          </div>
        {{ end }}
        {{ range first 1 (after 1 $pages) }}
        <div class="col">
          <div class="article-card">
            {{ .Render "home-second"}}
          </div>
        </div>
        {{ end }}
    </div>
  </div>
{{ end }}
