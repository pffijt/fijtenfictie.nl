{{ $dateMachine := .Page.Date | time.Format "2006-01-02T15:04:05-07:00" }}
{{ $dateHuman := .Page.Date | time.Format "Monday 2 January 2006" }}

<h4 class="author-text">
    {{ if .Param "authors" }}
        {{ delimit (.Param "authors") ", " }} <br/>
    {{ end }}
    <time datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
</h4>
