{{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
{{ $dateHuman := .Date | time.Format "Monday 2 January 2006" }}
<div class="container">
    <div class="row text-start">
        <div class="col header-clock">
            <time datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
        </div>
    </div>

    <div class="row text-center">
        <div class="col">
            <h1>
                <a href="{{ .Site.BaseURL }}">
                    <picture>
                        <source srcset="{{ .Site.BaseURL }}/fijt_fictie_dark.webp" media="(prefers-color-scheme: dark)">
                        <img class="header-logo" width="810" height="237" src="{{ .Site.BaseURL }}/fijt_fictie_light.webp" title="{{ $.Site.Params.logoAlternative }}" alt="Logo van {{ $.Site.Params.logoAlternative }}" role="img">
                    </picture>
                </a>
            </h1>
        </div>
    </div>

    <div class="text-center">
        <h2>
            {{ $.Site.Params.headline }}
        </h2>
        <hr class="header-hr"/>
    </div>
</div>
