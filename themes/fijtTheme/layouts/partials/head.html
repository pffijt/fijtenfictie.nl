<meta charset="utf-8">
<meta name="viewport" content="width=device-width">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni&family=Playfair+Display&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
    <link
    href="https://fonts.googleapis.com/css2?family=Libre+Bodoni&family=+DiPlayfairsplay&display=swap"
    rel="stylesheet"
    type="text/css"
    />
</noscript>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" async integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="https://kit.fontawesome.com/0dad904ca9.js" async crossorigin="anonymous"></script>

{{ $pageTitle := site.Title }}

{{ if not .IsHome  }}
    {{ $pageTitle = print .Title " | " site.Title }}
{{ end }}

<title itemprop="name">{{ $pageTitle }}</title>

<meta property="og:title" content="{{ $pageTitle }}" />
<meta property="og:site_name" content="{{ site.Title }}" />
<meta property="og:image" content="{{ .Site.BaseURL }}/logo_social.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="810" />
<meta property="og:image:height" content="237" />
<meta property="og:image:alt" content="{{ site.Title }}" />
<meta property="og:description" content="{{ .Description }}" />
<meta property="og:locale" content="{{ replace .Site.Language.LanguageCode "-" "_" }}" />


<meta itemprop="name" content="{{ $pageTitle }}" />
<meta name="application-name" content="{{ $pageTitle }}" />
<meta name="twitter:description" content="{{ .Description }}" />
<meta name="twitter:title" content="{{ $pageTitle }}" />

<meta name="description" content="{{ .Description }}" />
<meta itemprop="description" content="{{ .Description }}" />



{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}
