{{ define "main" }}
<section class="page">
  <p class="eyebrow">{{ .Params.eyebrow }}</p>
  <h1 class="page-title">{{ .Title }}</h1>
  <dl class="org-info">
    {{- range .Params.items }}
    <dt>{{ .label }}</dt>
    <dd>{{ range (strings.Split .value "\n") }}{{ with . }}<p>{{ . }}</p>{{ end }}{{ end }}</dd>
    {{- end }}
  </dl>
  {{- with .Params.policy_plan_url }}
  <p><a class="underlink" href="{{ . | relURL }}" target="_blank" rel="noopener">Lees het volledige beleidsplan (pdf)</a></p>
  {{- end }}
</section>
{{ end }}
