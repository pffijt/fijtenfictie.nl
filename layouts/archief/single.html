{{ define "main" }}
{{ $p := . }}
<section class="page">
  <a class="underlink" href="{{ "/archief/" | relURL }}">Terug naar het archief</a>
  <article class="article">
    <h1>{{ $p.Title }}</h1>
    {{ with $p.Params.image }}
    <figure class="article-image">
      <img src="{{ . | relURL }}" alt="{{ $p.Params.image_alt }}" loading="lazy">
    </figure>
    {{ end }}
    {{ $p.Content }}
  </article>
</section>
{{ end }}
