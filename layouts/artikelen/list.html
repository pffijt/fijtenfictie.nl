{{ define "main" }}

<section class="page">
  <p class="eyebrow">{{ .Params.eyebrow }}</p>
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="page-intro">{{ .Content }}</div>
  {{ range $essays }}
  {{ partial "components/mag-spread.html" . }}
  {{ end }}
</section>
{{ end }}
